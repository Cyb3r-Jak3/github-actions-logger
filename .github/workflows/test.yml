name: Python Checking

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - '**.py'
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:

jobs:
  Lint:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [ '3.12', '3.13', '3.14', '3.15', 'pypy3.11', 'pypy3.12' ]
        include:
          - os: ubuntu-latest
            path: ~/.cache/pip
          - os: macos-latest
            path: ~/Library/Caches/pip
          - os: windows-latest
            path: ~\AppData\Local\pip\Cache

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pip Cache
      uses: actions/cache@v6
      with:
        path: ${{ matrix.path }}
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}
          ${{ runner.os }}-pip

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel
        uv sync --all

    - name: Lint
      run: |
       make lint

    - name: Test
      run: |
        make test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        env_vars: OS,PYTHON
      env:
        OS: ${{ matrix.os }}
        PYTHON: ${{ matrix.python-version }}
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Build
      run: |
        pip install wheel twine --quiet
        poetry build
        twine check --strict dist/*